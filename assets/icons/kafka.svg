<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" fill="none">
  <!-- Central Hub Node -->
  <circle cx="28" cy="50" r="10" fill="#231F20"/>
  <!-- Top Node -->
  <circle cx="72" cy="24" r="8" fill="#231F20"/>
  <!-- Bottom Node -->
  <circle cx="72" cy="76" r="8" fill="#231F20"/>
  <!-- Connecting Links -->
  <path d="M28 50 L72 24" stroke="#231F20" stroke-width="5" stroke-linecap="round"/>
  <path d="M28 50 L72 76" stroke="#231F20" stroke-width="5" stroke-linecap="round"/>
  <!-- Middle Accent Branch -->
  <circle cx="50" cy="50" r="6" fill="#231F20"/>
  <path d="M28 50 L50 50" stroke="#231F20" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Outer Satellite Node -->
  <circle cx="82" cy="50" r="7" fill="#231F20"/>
  <path d="M50 50 L82 50" stroke="#231F20" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 24 L82 50" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M72 76 L82 50" stroke="#231F20" stroke-width="3.5" stroke-linecap="round"/>
</svg>